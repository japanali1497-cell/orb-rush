<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orb Rush — Neon Dodge Game</title><meta name="theme-color" content="#0b0b1e">
<link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b1e;color:#fff;font:16px system-ui,Arial;touch-action:none}
#stage{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#08081ddd;text-align:center;padding:20px}
h1{font-size:clamp(42px,12vw,72px);letter-spacing:4px;margin:0;background:linear-gradient(90deg,#5ef,#f6a);color:transparent;background-clip:text}
p{margin:0;opacity:.85}button{border:0;border-radius:12px;padding:12px 28px;font:bold 18px system-ui;background:linear-gradient(#5ef,#39d);color:#012;min-width:190px}
.hide{display:none!important}#score{position:absolute;top:12px;left:16px;font-size:24px;font-weight:800;text-shadow:0 0 10px #5ef}
</style></head><body><div id="stage"><canvas id="c"></canvas><div id="score">0</div>
<div id="ui"><h1>ORB RUSH</h1><p>Drag or use ← → to dodge red blocks and collect coins.</p><button id="play">▶ Play</button><p id="best"></p></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),x=c.getContext('2d'),ui=document.getElementById('ui'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let w=0,h=0,dpr=1,player=0,target=0,items=[],score=0,best=0,last=0,spawn=0,running=false,over=false,keys={};
try{best=+(localStorage.orb_best||0)}catch(e){} bestEl.textContent='Best: '+best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=c.clientWidth=innerWidth;h=c.clientHeight=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);player=target=w/2}
addEventListener('resize',resize);resize();
function start(){items=[];score=0;spawn=.4;player=target=w/2;running=true;over=false;ui.classList.add('hide');scoreEl.classList.remove('hide');last=performance.now()}
document.getElementById('play').onclick=start;
function pointer(e){target=Math.max(18,Math.min(w-18,e.clientX))}c.addEventListener('pointerdown',pointer);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='Enter'&&!running)start()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function finish(){running=false;over=true;best=Math.max(best,Math.floor(score));try{localStorage.orb_best=best}catch(e){}bestEl.textContent='Score: '+Math.floor(score)+' · Best: '+best;ui.querySelector('h1').textContent='GAME OVER';ui.querySelector('p').textContent='Try again — can you beat your best?';ui.querySelector('button').textContent='Play Again';ui.classList.remove('hide')}
function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;
x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0b0b1e');g.addColorStop(1,'#211044');x.fillStyle=g;x.fillRect(0,0,w,h);
for(let i=0;i<50;i++){x.fillStyle='#ffffff55';x.fillRect((i*137)%w,((i*83+now*.025)%(h+2)),2,2)}
if(running){score+=dt*5;spawn-=dt;if(spawn<=0){let coin=Math.random()<.2,s=coin?11:15+Math.random()*18;items.push({x:s+Math.random()*(w-2*s),y:-s,s,coin,v:180+Math.min(score*1.5,250)});spawn=Math.max(.22,.65-score*.001)}
let dir=(keys.right?1:0)-(keys.left?1:0);if(dir)target=Math.max(18,Math.min(w-18,target+dir*350*dt));player+=(target-player)*Math.min(1,dt*15);
for(let i=items.length-1;i>=0;i--){let a=items[i];a.y+=a.v*dt;let dx=a.x-player,dy=a.y-(h-65);if(dx*dx+dy*dy<(a.s+13)**2){if(a.coin){score+=10;items.splice(i,1);continue}else{finish();break}}if(a.y>h+30)items.splice(i,1)}
scoreEl.textContent=Math.floor(score)}
for(const a of items){x.save();x.translate(a.x,a.y);if(a.coin){x.shadowColor='#fc0';x.shadowBlur=16;x.fillStyle='#ffd700';x.beginPath();x.arc(0,0,a.s,0,Math.PI*2);x.fill()}else{x.shadowColor='#f33';x.shadowBlur=14;x.fillStyle='#ff4433';x.fillRect(-a.s/2,-a.s/2,a.s,a.s)}x.restore()}
if(running){x.shadowColor='#5ef';x.shadowBlur=20;x.fillStyle='#55eeff';x.beginPath();x.arc(player,h-65,13,0,Math.PI*2);x.fill();x.shadowBlur=0}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
